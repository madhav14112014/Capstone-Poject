<!DOCTYPE html>
<html>
    <head>
        <title>Home Page</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
            }
            .topNav {
                background-color: #75cee2;
                overflow: hidden;
            }
            .topNav a {
                float: left;
                display: block;
                color: white;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topNav a:hover {
                background-color: #e7d8d8;
                color: black;
            }
            .topNav a.active {
                background-color: #4caf98;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="topNav">
            <a class="active" href="main.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </div>
        <section>
            <img class="mySlide" src="Library image.jpg" style="width:100%; height:500px;">
             <img class="mySlide" src="Library image-1.jpg" style="width:100%; height:500px;">
              <img class="mySlide" src="Library image-2.jpg" style="width:100%; height:500px;">
               <img class="mySlide" src="Library image-3.jpg" style="width:100%; height:500px;">
        </section>
        <script>
            var myIndex = 0;
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlide");
                for(i=0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if(myIndex >x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000);
            }
        </script>
    </body>
</html>
